<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff8e8"><title>Kart Clash: Rival Academy</title><link rel="icon" href="data:,"><link rel="stylesheet" href="kart/game.css"><script id="boot-guard">
(() => {
  let failed = false;
  function showFailure() {
    const panel = document.getElementById('loading');
    if (!panel || window.kartGame || location.protocol === 'file:') return;
    panel.hidden = false;
    panel.replaceChildren();
    const message = document.createElement('p');
    message.textContent = 'Des fichiers du jeu ne sont pas disponibles. Vérifie le serveur local puis recharge la page.';
    const retry = document.createElement('button');
    retry.textContent = 'Recharger le jeu';
    retry.onclick = () => location.reload();
    panel.append(message, retry);
  }
  window.addEventListener('error', event => {
    if (['SCRIPT', 'LINK'].includes(event.target?.tagName)) {
      failed = true;
      showFailure();
    }
  }, true);
  document.addEventListener('DOMContentLoaded', () => { if (failed) showFailure(); }, {once:true});
})();
